# network
- id: dns
  label: DNS
  summary: >-
    Hostname to IP. Cached at OS and browser level. dns-prefetch hint warms it.
  sources:
    - title: 'MDN: DNS'
      url: https://developer.mozilla.org/en-US/docs/Glossary/DNS
  verified: 2026-11-17
- id: tcp
  label: TCP
  summary: >-
    Reliable byte stream. One round trip to establish.
  sources:
    - title: 'MDN: TCP'
      url: https://developer.mozilla.org/en-US/docs/Glossary/TCP
  verified: 2026-11-17
- id: tls
  label: TLS
  summary: >-
    Encryption handshake on top of TCP. 1 to 2 more round trips. TLS 1.3 allows 0-RTT resumption.
  sources:
    - title: 'MDN: Transport Layer Security'
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Transport_Layer_Security
  verified: 2026-11-17
- id: http1
  label: HTTP/1.1
  summary: >-
    One request per connection at a time. Browsers open 6 per host to compensate.
  sources:
    - title: 'MDN: Evolution of HTTP'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Evolution_of_HTTP
  verified: 2026-11-17
- id: http2
  label: HTTP/2
  summary: >-
    Multiplexes many streams over one connection. Header compression. Head-of-line blocking moves to
    TCP.
  sources:
    - title: 'RFC 9113: HTTP/2'
      url: https://www.rfc-editor.org/rfc/rfc9113.html
  verified: 2026-11-17
- id: http3
  label: HTTP/3 / QUIC
  summary: >-
    UDP based. No TCP head-of-line blocking, faster handshake, connection migration.
  sources:
    - title: 'RFC 9114: HTTP/3'
      url: https://www.rfc-editor.org/rfc/rfc9114.html
  verified: 2026-11-17
- id: http_cache
  label: HTTP cache
  summary: >-
    Disk and memory cache keyed by URL. Cache-Control decides freshness; ETag enables cheap
    revalidation.
  sources:
    - title: 'MDN: HTTP caching'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching
  verified: 2026-11-17
- id: cache_control
  label: Cache-Control & ETag
  summary: >-
    max-age, immutable, no-store, stale-while-revalidate. The headers that decide whether a request
    leaves the device.
  sources:
    - title: 'MDN: Cache-Control'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control
  verified: 2026-11-17
- id: cdn
  label: CDN
  summary: >-
    Edge servers near users. Caches responses, terminates TLS close by, cuts TTFB.
  sources:
    - title: 'MDN: CDN'
      url: https://developer.mozilla.org/en-US/docs/Glossary/CDN
  verified: 2026-11-17
- id: fetch
  label: fetch()
  summary: >-
    Promise-based request API. Streams the body. Does not reject on HTTP errors.
  sources:
    - title: 'MDN: Using the Fetch API'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
  verified: 2026-11-17
- id: xhr
  label: XMLHttpRequest
  summary: >-
    The older request API. Still the only one with upload progress events.
  sources:
    - title: 'MDN: XMLHttpRequest'
      url: https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequest
  verified: 2026-11-17
- id: websocket
  label: WebSocket
  summary: >-
    Persistent bidirectional connection upgraded from HTTP.
  sources:
    - title: 'MDN: The WebSocket API'
      url: https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API
  verified: 2026-11-17
- id: sse
  label: Server-sent events
  summary: >-
    One-way server push over a long-lived HTTP response. Auto-reconnects.
  sources:
    - title: 'MDN: Using server-sent events'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events
  verified: 2026-11-17
- id: streams
  label: Streams API
  summary: >-
    ReadableStream and friends. Process a response as chunks arrive instead of waiting for the whole
    body.
  sources:
    - title: 'MDN: Streams API'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Streams_API
  verified: 2026-11-17
- id: resource_hints
  label: Resource hints
  summary: >-
    preload, preconnect, prefetch, modulepreload, dns-prefetch. Tell the browser about resources before
    it discovers them.
  sources:
    - title: 'Establish network connections early'
      url: https://web.dev/articles/preconnect-and-dns-prefetch
  verified: 2026-11-17
- id: compression
  label: Compression
  summary: >-
    gzip and brotli for text. Images and fonts need their own formats (AVIF, WOFF2).
  sources:
    - title: 'MDN: Compression in HTTP'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Compression
  verified: 2026-11-17
- id: service_worker
  label: Service worker
  summary: >-
    A programmable proxy in a worker thread. Intercepts fetches, serves from Cache API, enables offline
    and push.
  sources:
    - title: 'MDN: Using Service Workers'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers
  verified: 2026-11-17
- id: early_hints
  label: '103 Early Hints'
  summary: >-
    Server sends preload hints before the real response so the browser starts fetching CSS and fonts
    during server think time.
  sources:
    - title: 'MDN: 103 Early Hints'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/103
  verified: 2026-11-17

# transport (added in the content drive, 2026-11-17)
- id: quic
  label: QUIC
  summary: >-
    Transport over UDP with TLS 1.3 built in. Streams are independent, so one lost packet does not stall
    the others, and connections survive network changes. Carries HTTP/3.
  sources:
    - title: 'RFC 9000: QUIC'
      url: https://www.rfc-editor.org/rfc/rfc9000.html
  verified: 2026-11-17
