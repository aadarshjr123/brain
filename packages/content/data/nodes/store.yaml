# network
- id: cache_api
  label: Cache API
  summary: >-
    Request/Response storage used by service workers. Async, promise-based.
  sources:
    - title: 'MDN: Cache'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Cache
  verified: 2026-11-17

# security
- id: cookies
  label: Cookies
  summary: >-
    Sent automatically with requests to their domain. HttpOnly hides them from JS, SameSite limits
    cross-site sending.
  sources:
    - title: 'MDN: Using HTTP cookies'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies
  verified: 2026-11-17

# storage
- id: localstorage
  label: localStorage
  summary: >-
    Synchronous key-value strings, ~5MB, per origin. Blocks the main thread. Not available in workers.
  sources:
    - title: 'MDN: Window.localStorage'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage
  verified: 2026-11-17
- id: sessionstorage
  label: sessionStorage
  summary: >-
    Same as localStorage but per tab and cleared when the tab closes.
  sources:
    - title: 'MDN: Window.sessionStorage'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage
  verified: 2026-11-17
- id: indexeddb
  label: IndexedDB
  summary: >-
    Async transactional object store. Works in workers. Stores structured-clonable data.
  sources:
    - title: 'MDN: Using IndexedDB'
      url: https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB
  verified: 2026-11-17
- id: opfs
  label: Origin private file system
  summary: >-
    Fast file access for an origin, mostly in workers. Used by SQLite-in-the-browser.
  sources:
    - title: 'MDN: Origin private file system'
      url: https://developer.mozilla.org/en-US/docs/Web/API/File_System_API/Origin_private_file_system
  verified: 2026-11-17
- id: storage_quota
  label: Storage quota
  summary: >-
    Per-origin budget. Eviction happens under pressure unless persisted.
  sources:
    - title: 'MDN: Storage quotas and eviction criteria'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria
  verified: 2026-11-17
