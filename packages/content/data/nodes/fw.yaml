# frameworks
- id: vdom
  label: Virtual DOM
  summary: >-
    A JS tree describing UI. Diffed against the previous one so only real changes hit the DOM. React,
    Vue, Preact.
  verified: 2026-11-16
- id: reconciliation
  label: Reconciliation (diffing)
  summary: >-
    Compare new and old element trees. Keys let the algorithm match list items instead of reusing by
    position.
  verified: 2026-11-16
- id: fiber
  label: React Fiber
  summary: >-
    React’s linked-list rewrite of the stack so rendering can be paused, resumed and prioritised.
  verified: 2026-11-16
- id: react_scheduler
  label: React scheduler
  summary: >-
    Splits render work into 5ms chunks and yields via MessageChannel so the browser can handle input
    between them.
  verified: 2026-11-16
- id: render_phase
  label: Render phase
  summary: >-
    Components run, hooks called, new tree computed. Pure and interruptible. No DOM yet.
  verified: 2026-11-16
- id: commit_phase
  label: Commit phase
  summary: >-
    DOM mutations applied synchronously. Then layout effects, then passive effects later.
  verified: 2026-11-16
- id: set_state
  label: setState / batching
  summary: >-
    State updates are queued, not applied. React batches all updates in the same tick into one render.
  verified: 2026-11-16
- id: hooks
  label: Hooks
  summary: >-
    State and effects stored on the fiber in call order. Which is why they cannot be conditional.
  verified: 2026-11-16
- id: use_effect
  label: useEffect
  summary: >-
    Runs after paint, in a separate task. Safe for subscriptions and fetches, wrong for measuring
    layout.
  verified: 2026-11-16
- id: use_layout_effect
  label: useLayoutEffect
  summary: >-
    Runs synchronously after DOM mutation, before paint. Reads layout here cause forced layout but no
    flicker.
  verified: 2026-11-16
- id: memo
  label: Memoization
  summary: >-
    memo, useMemo, useCallback. Skip work when inputs are unchanged. Costs memory and comparison time.
  verified: 2026-11-16
- id: context
  label: Context
  summary: >-
    Pass values down without props. Every consumer re-renders when the value identity changes.
  verified: 2026-11-16
- id: concurrent
  label: Concurrent rendering
  summary: >-
    Transitions and deferred values let React render in the background and throw away work when input
    arrives.
  verified: 2026-11-16
- id: suspense
  label: Suspense
  summary: >-
    A component throws a promise. React shows a fallback and retries when it resolves.
  verified: 2026-11-16
- id: ssr
  label: Server-side rendering
  summary: >-
    HTML generated on the server. Fast first paint, then JS must hydrate before anything is interactive.
  verified: 2026-11-16
- id: hydration
  label: Hydration
  summary: >-
    Attach event listeners and state to server-rendered DOM. Mismatch errors come from different output
    on server and client.
  verified: 2026-11-16
- id: streaming_ssr
  label: Streaming SSR
  summary: >-
    Server flushes HTML in chunks as Suspense boundaries resolve. Browser parses progressively.
  verified: 2026-11-16
- id: rsc
  label: Server components
  summary: >-
    Components that run only on the server and send a serialised tree, not JS, to the client.
  verified: 2026-11-16
- id: islands
  label: Islands architecture
  summary: >-
    Static HTML with isolated interactive islands that hydrate independently. Astro, Fresh.
  verified: 2026-11-16
- id: signals
  label: Signals / fine-grained reactivity
  summary: >-
    Track which computation read which value and update only those. Solid, Vue, Svelte 5, Preact
    signals. No diffing.
  verified: 2026-11-16
- id: compiler
  label: Framework compilers
  summary: >-
    Svelte, Vue and React Compiler analyse components at build time to skip runtime work.
  verified: 2026-11-16
- id: code_splitting
  label: Code splitting / lazy
  summary: >-
    React.lazy and route-level chunks built on dynamic import.
  verified: 2026-11-16
- id: csr_router
  label: Client-side router
  summary: >-
    Intercepts link clicks, pushes history, renders the matching component without a navigation.
  verified: 2026-11-16
- id: state_store
  label: State management
  summary: >-
    Redux, Zustand, Pinia, Jotai. External stores sync into React via useSyncExternalStore.
  verified: 2026-11-16
- id: bundler
  label: Bundler
  summary: >-
    Vite, webpack, esbuild. Resolves modules, tree-shakes, splits chunks, hashes filenames for caching.
  verified: 2026-11-16
- id: tree_shaking
  label: Tree shaking
  summary: >-
    Dropping unused exports. Requires ES modules and side-effect-free code.
  verified: 2026-11-16
