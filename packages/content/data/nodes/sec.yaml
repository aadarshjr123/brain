# security
- id: sop
  label: Same-origin policy
  summary: >-
    Scheme + host + port. Scripts can only read responses and DOM from their own origin unless
    explicitly allowed.
  sources:
    - title: 'MDN: Same-origin policy'
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy
  verified: 2026-11-17
- id: cors
  label: CORS
  summary: >-
    Server headers that relax the same-origin policy for a response. Browser enforces, server opts in.
  sources:
    - title: 'MDN: Cross-Origin Resource Sharing (CORS)'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
  verified: 2026-11-17
- id: preflight
  label: CORS preflight
  summary: >-
    An OPTIONS request sent first when a cross-origin request has custom headers or non-simple methods.
    An extra round trip.
  sources:
    - title: 'MDN: Preflight request'
      url: https://developer.mozilla.org/en-US/docs/Glossary/Preflight_request
  verified: 2026-11-17
- id: csp
  label: Content Security Policy
  summary: >-
    Header that whitelists where scripts, styles and connections may come from. The main XSS mitigation.
  sources:
    - title: 'MDN: Content Security Policy'
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
  verified: 2026-11-17
- id: xss
  label: XSS
  summary: >-
    Injecting script via untrusted HTML. innerHTML with user data, or dangerouslySetInnerHTML, is the
    classic hole.
  sources:
    - title: 'OWASP: Cross Site Scripting'
      url: https://community.owasp.org/attacks/xss/
  verified: 2026-11-17
- id: csrf
  label: CSRF
  summary: >-
    Another site makes your browser send a request with your cookies attached. SameSite cookies and
    tokens defend.
  sources:
    - title: 'OWASP: Cross Site Request Forgery'
      url: https://community.owasp.org/attacks/csrf
  verified: 2026-11-17
- id: https
  label: HTTPS / HSTS
  summary: >-
    TLS for the web. HSTS makes the browser refuse plain HTTP for a site.
  sources:
    - title: 'MDN: HTTPS'
      url: https://developer.mozilla.org/en-US/docs/Glossary/HTTPS
  verified: 2026-11-17
- id: coop_coep
  label: COOP / COEP
  summary: >-
    Cross-origin isolation headers. Required for SharedArrayBuffer and high-resolution timers.
  sources:
    - title: 'Making your website cross-origin isolated using COOP and COEP'
      url: https://web.dev/articles/coop-coep
  verified: 2026-11-17
- id: sandbox
  label: iframe sandbox
  summary: >-
    Restricts what an embedded document can do: scripts, forms, top navigation.
  sources:
    - title: 'MDN: iframe sandbox attribute'
      url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe
  verified: 2026-11-17
- id: sri
  label: Subresource integrity
  summary: >-
    A hash on script and link tags so a tampered CDN file is refused.
  sources:
    - title: 'MDN: Subresource Integrity'
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Subresource_Integrity
  verified: 2026-11-17
- id: trusted_types
  label: Trusted Types
  summary: >-
    Makes dangerous DOM sinks accept only typed, sanitised values.
  sources:
    - title: 'MDN: Trusted Types API'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Trusted_Types_API
  verified: 2026-11-17
