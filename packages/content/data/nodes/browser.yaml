# processes & threads
- id: browser_process
  label: Browser process
  summary: >-
    The parent process. Owns the UI (address bar, tabs), navigation, and brokers network and storage for
    renderers.
  sources:
    - title: 'Inside look at modern web browser, part 1'
      url: https://developer.chrome.com/blog/inside-browser-part1
  verified: 2026-11-17
- id: renderer_process
  label: Renderer process
  summary: >-
    One per site (site isolation). Runs the main thread, compositor thread and worker threads for a tab.
  sources:
    - title: 'Inside look at modern web browser, part 1'
      url: https://developer.chrome.com/blog/inside-browser-part1
  verified: 2026-11-17
- id: gpu_process
  label: GPU process
  summary: >-
    Talks to the graphics driver. Receives compositor frames and draws them to the screen.
  sources:
    - title: 'RenderingNG architecture'
      url: https://developer.chrome.com/docs/chromium/renderingng-architecture
  verified: 2026-11-17
- id: network_service
  label: Network service
  summary: >-
    The process that actually does DNS, sockets, TLS and the HTTP cache on behalf of renderers.
  sources:
    - title: 'Inside look at modern web browser, part 2'
      url: https://developer.chrome.com/blog/inside-browser-part2
  verified: 2026-11-17
- id: main_thread
  label: Main thread
  summary: >-
    Where your JS, style, layout and paint all run. One thread, 16.7ms per frame at 60Hz. The thing you
    are always fighting for.
  sources:
    - title: 'Inside look at modern web browser, part 3'
      url: https://developer.chrome.com/blog/inside-browser-part3
  verified: 2026-11-17
- id: compositor_thread
  label: Compositor thread
  summary: >-
    Assembles layers into a frame without the main thread. Handles scroll and compositor-only animations
    even when JS is blocked.
  sources:
    - title: 'Inside look at modern web browser, part 4'
      url: https://developer.chrome.com/blog/inside-browser-part4
  verified: 2026-11-17
- id: raster_threads
  label: Raster threads
  summary: >-
    Turn paint display lists into pixel tiles, usually on the GPU. Only dirty tiles are redone.
  sources:
    - title: 'RenderingNG architecture'
      url: https://developer.chrome.com/docs/chromium/renderingng-architecture
  verified: 2026-11-17
- id: site_isolation
  label: Site isolation
  summary: >-
    Each site gets its own renderer process so a compromised page cannot read another site’s memory
    (Spectre defence).
  sources:
    - title: 'Site isolation (Chromium)'
      url: https://www.chromium.org/Home/chromium-security/site-isolation/
  verified: 2026-11-17

# loading & parsing
- id: navigation
  label: Navigation
  summary: >-
    Browser process starts the request, picks or creates a renderer, then commits once headers arrive.
  sources:
    - title: 'Inside look at modern web browser, part 2'
      url: https://developer.chrome.com/blog/inside-browser-part2
  verified: 2026-11-17
- id: html_parser
  label: HTML parser
  summary: >-
    Tokenizer plus tree builder. Incremental: builds DOM as bytes stream in. Pauses on a classic script
    tag.
  sources:
    - title: 'HTML Standard: parsing HTML documents'
      url: https://html.spec.whatwg.org/multipage/parsing.html
  verified: 2026-11-17
- id: preload_scanner
  label: Preload scanner
  summary: >-
    A lookahead parser that finds src and href attributes and starts fetches while the main parser is
    blocked.
  sources:
    - title: "Don't fight the browser preload scanner"
      url: https://web.dev/articles/preload-scanner
  verified: 2026-11-17
- id: css_parser
  label: CSS parser
  summary: >-
    Turns stylesheets into CSSOM. Stylesheets are render-blocking: no paint until they are parsed.
  sources:
    - title: 'MDN: How CSS works'
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/What_is_CSS
  verified: 2026-11-17
- id: dom
  label: DOM
  summary: >-
    The live tree of nodes. Every JS DOM API call is a message into this structure. Mutations mark it
    dirty for style.
  sources:
    - title: 'MDN: Document Object Model'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model
  verified: 2026-11-17
- id: cssom
  label: CSSOM
  summary: >-
    Parsed stylesheet rules. Combined with DOM to resolve the cascade.
  sources:
    - title: 'MDN: CSS Object Model'
      url: https://developer.mozilla.org/en-US/docs/Web/API/CSS_Object_Model
  verified: 2026-11-17
- id: bfcache
  label: Back/forward cache
  summary: >-
    Keeps the whole page alive in memory when you navigate away so back is instant. Broken by unload
    listeners and open connections.
  sources:
    - title: 'Back/forward cache'
      url: https://web.dev/articles/bfcache
  verified: 2026-11-17

# render pipeline
- id: style_calc
  label: Style recalculation
  summary: >-
    Matches selectors to nodes and computes the final value of every property. Cost grows with selector
    complexity and tree size.
  sources:
    - title: 'Reduce the scope and complexity of style calculations'
      url: https://web.dev/articles/reduce-the-scope-and-complexity-of-style-calculations
  verified: 2026-11-17
- id: layout
  label: Layout (reflow)
  summary: >-
    Computes the geometry of every box. Changing width, font-size or adding nodes dirties it. Can
    cascade across the whole tree.
  sources:
    - title: 'Avoid large, complex layouts and layout thrashing'
      url: https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing
  verified: 2026-11-17
- id: paint
  label: Paint
  summary: >-
    Records draw commands (display list) per layer. Not pixels yet.
  sources:
    - title: 'Simplify paint complexity and reduce paint areas'
      url: https://web.dev/articles/simplify-paint-complexity-and-reduce-paint-areas
  verified: 2026-11-17
- id: layers
  label: Compositing layers
  summary: >-
    Elements promoted to their own layer (transform, will-change, video) can move without repainting
    others. Each costs GPU memory.
  sources:
    - title: 'Stick to compositor-only properties and manage layer count'
      url: https://web.dev/articles/stick-to-compositor-only-properties-and-manage-layer-count
  verified: 2026-11-17
- id: composite
  label: Composite
  summary: >-
    Compositor thread positions all layer tiles and ships a frame to the GPU.
  sources:
    - title: 'Inside look at modern web browser, part 3'
      url: https://developer.chrome.com/blog/inside-browser-part3
  verified: 2026-11-17
- id: frame
  label: Frame / vsync
  summary: >-
    The display refresh tick. The pipeline tries to produce one frame per tick. Miss it and you get
    jank.
  sources:
    - title: 'MDN: Populating the page: how browsers work'
      url: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work
  verified: 2026-11-17
- id: forced_layout
  label: Forced synchronous layout
  summary: >-
    Reading offsetWidth or getBoundingClientRect after a DOM write makes the browser run layout right
    now, inside your JS.
  sources:
    - title: 'Avoid large, complex layouts and layout thrashing'
      url: https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing
  verified: 2026-11-17
- id: hit_test
  label: Hit testing
  summary: >-
    Finds which element is under the pointer. Needs up-to-date layout.
  sources:
    - title: 'Inside look at modern web browser, part 4'
      url: https://developer.chrome.com/blog/inside-browser-part4
  verified: 2026-11-17
- id: input_events
  label: Input events
  summary: >-
    Mouse, touch, keyboard arrive in the browser process, go to the compositor, then queue a task on the
    main thread.
  sources:
    - title: 'Inside look at modern web browser, part 4'
      url: https://developer.chrome.com/blog/inside-browser-part4
  verified: 2026-11-17
- id: scroll
  label: Scrolling
  summary: >-
    Handled on the compositor thread using already-rasterised tiles. Non-passive listeners force it to
    wait for the main thread.
  sources:
    - title: 'MDN: EventTarget.addEventListener, passive listeners'
      url: https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener
  verified: 2026-11-17

# event loop
- id: event_loop
  label: Event loop
  summary: >-
    The loop that picks one task, runs it to completion, drains all microtasks, then maybe renders.
    Everything async funnels through here.
  sources:
    - title: 'HTML Standard: event loops'
      url: https://html.spec.whatwg.org/multipage/webappapis.html#event-loops
  verified: 2026-11-17
- id: task_queue
  label: Task queue (macrotasks)
  summary: >-
    setTimeout callbacks, I/O, input events, message events. One task per loop turn, rendering may
    happen between them.
  sources:
    - title: 'MDN: In depth: microtasks and the JavaScript runtime environment'
      url: https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide/In_depth
  verified: 2026-11-17
- id: microtask_queue
  label: Microtask queue
  summary: >-
    Promise reactions, queueMicrotask, MutationObserver. Drained completely after every task, before
    rendering. Can starve the frame.
  sources:
    - title: 'MDN: Using microtasks in JavaScript with queueMicrotask()'
      url: https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide
  verified: 2026-11-17
- id: raf
  label: requestAnimationFrame
  summary: >-
    Callbacks run once per frame right before style and layout. The correct place for visual updates.
  sources:
    - title: 'MDN: Window.requestAnimationFrame()'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame
  verified: 2026-11-17
- id: ric
  label: requestIdleCallback
  summary: >-
    Runs when the browser has nothing better to do. Deadline-based. Good for non-urgent work.
  sources:
    - title: 'MDN: Window.requestIdleCallback()'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Window/requestIdleCallback
  verified: 2026-11-17
- id: timers
  label: Timers
  summary: >-
    setTimeout and setInterval. Minimum 4ms when nested, throttled to 1s in background tabs.
  sources:
    - title: 'MDN: Window.setTimeout()'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout
  verified: 2026-11-17
- id: web_workers
  label: Web Workers
  summary: >-
    Separate thread with its own event loop. No DOM access. Talk via postMessage and structured clone.
  sources:
    - title: 'MDN: Using Web Workers'
      url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers
  verified: 2026-11-17
- id: long_task
  label: Long task
  summary: >-
    Any task over 50ms. Blocks input, blocks rendering, hurts INP. The metric your profiler flags red.
  sources:
    - title: 'Optimize long tasks'
      url: https://web.dev/articles/optimize-long-tasks
  verified: 2026-11-17

# events (added in the content drive, 2026-11-17)
- id: event_propagation
  label: Event propagation
  summary: >-
    A DOM event travels from the window down to the target (capture), then back up (bubble). Listeners on
    every ancestor get a turn unless one calls stopPropagation.
  sources:
    - title: 'MDN: Event bubbling'
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling
  verified: 2026-11-17
- id: event_delegation
  label: Event delegation
  summary: >-
    One listener on a common ancestor handles events from many children by reading event.target. Fewer
    listeners, and new children work without extra wiring.
  aliases: [delegated events]
  sources:
    - title: 'MDN: Event bubbling, event delegation'
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling
  verified: 2026-11-17
