<title>Brain Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night-map. Full-bleed canvas, glass panels floating over it: top bar, left legend, bottom trail, right detail sheet. */
:root{
  --bg:#070a10; --bg-2:#0b1018; --surface:rgba(16,21,31,.82); --surface-solid:#10151f; --surface-2:rgba(255,255,255,.06); --line:rgba(140,155,180,.18); --line-strong:rgba(140,155,180,.35);
  --fg:#e8eef6; --muted:#8c9bb3; --accent:#ffb454; --accent-ink:#070a10;
  --d-browser:#ff7a59; --d-js:#ffd166; --d-net:#4fb3ff; --d-fw:#5eead4; --d-perf:#f472b6; --d-sec:#a78bfa; --d-store:#4ade80; --d-api:#fb923c;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif; --font-body:"IBM Plex Sans",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef1f6; --bg-2:#e4e9f1; --surface:rgba(255,255,255,.82); --surface-solid:#ffffff; --surface-2:rgba(18,26,39,.06); --line:rgba(40,55,80,.14); --line-strong:rgba(40,55,80,.3);
  --fg:#121a27; --muted:#5a687f; --accent:#b85c08; --accent-ink:#ffffff; --shadow:0 10px 30px rgba(20,30,50,.12);
  --d-browser:#d9481f; --d-js:#a8780a; --d-net:#0b7fd6; --d-fw:#0f9488; --d-perf:#c2317f; --d-sec:#6d4fd6; --d-store:#15803d; --d-api:#c2580c; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#eef1f6; --bg-2:#e4e9f1; --surface:rgba(255,255,255,.82); --surface-solid:#ffffff; --surface-2:rgba(18,26,39,.06); --line:rgba(40,55,80,.14); --line-strong:rgba(40,55,80,.3);
  --fg:#121a27; --muted:#5a687f; --accent:#b85c08; --accent-ink:#ffffff; --shadow:0 10px 30px rgba(20,30,50,.12);
  --d-browser:#d9481f; --d-js:#a8780a; --d-net:#0b7fd6; --d-fw:#0f9488; --d-perf:#c2317f; --d-sec:#6d4fd6; --d-store:#15803d; --d-api:#c2580c; color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,kbd{font-family:var(--font-mono);font-size:.92em}
kbd{border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;font-size:10px;color:var(--muted)}

#stage{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.grabbing{cursor:grabbing} canvas.pick{cursor:crosshair}

.glass{background:var(--surface);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* top bar */
.bar{position:absolute;top:14px;left:0;right:0;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;pointer-events:none;z-index:4}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px}
.brand .mark{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),transparent 70%),var(--surface-2);box-shadow:0 0 0 1px var(--line-strong) inset}
.brand h1{font-family:var(--font-display);font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.search{justify-self:center;width:min(480px,100%);display:flex;align-items:center;gap:8px;padding:7px 12px;position:relative}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.search input{background:none;border:0;outline:0;width:100%;color:var(--fg);min-width:0}
.search input::placeholder{color:var(--muted)}
.search kbd{flex:none}
.sug{position:absolute;top:100%;left:0;right:0;margin-top:6px;overflow:hidden;display:none;max-height:300px;overflow-y:auto;padding:4px}
.sug button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
.sug button:hover,.sug button.hl{background:var(--surface-2)}
.sug .sw{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.sug .dm{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-left:auto;letter-spacing:.04em}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icons{display:flex;padding:3px;gap:2px}
.icons button{width:32px;height:30px;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.icons button:hover{background:var(--surface-2);color:var(--fg)}
.icons svg{width:16px;height:16px}

/* legend */
.legend{position:absolute;left:0;bottom:14px;padding:10px 12px;z-index:3;display:flex;flex-direction:column;gap:2px;min-width:190px}
.legend .t{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.legend button{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;font-size:12.5px;color:var(--fg);text-align:left}
.legend button:hover{background:var(--surface-2)}
.legend button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.legend button[aria-pressed="false"]{color:var(--muted)} .legend button[aria-pressed="false"]::before{opacity:.25;box-shadow:none}
.legend .cnt{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}

/* trail */
.trail{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:6px;align-items:center;padding:6px 8px;z-index:3;max-width:60%;overflow:hidden}
.trail:empty{display:none}
.trail .t{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.trail button{padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.trail button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.trail .sep{color:var(--muted);font-size:11px}

/* route pill */
.pill{position:absolute;left:50%;top:72px;transform:translateX(-50%);padding:7px 14px;z-index:3;display:none;font-size:13px;align-items:center;gap:10px}
.pill.show{display:flex}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

/* detail card */
.card{position:absolute;right:0;top:66px;width:340px;max-height:calc(100% - 92px);overflow:auto;z-index:4;display:none;flex-direction:column}
.card.show{display:flex}
.card-h{padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:1}
.card-h .dom{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.card-h .dom::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.card h2{font-family:var(--font-display);font-size:22px;margin:8px 0 6px;text-wrap:balance;line-height:1.15}
.card .desc{margin:0;color:var(--muted);font-size:13.5px}
.card .x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.card .x:hover{background:var(--surface-2);color:var(--fg)}
.card-b{padding:12px 16px 16px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.btn{padding:7px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn svg{width:13px;height:13px}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.touch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.touch button{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;align-items:center}
.touch button:hover{background:var(--surface-2)}
.touch .to{font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.touch .to::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.touch .rel{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:right;white-space:nowrap}
.hops{list-style:none;margin:0;padding:0;position:relative}
.hops::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:2px;background:var(--line)}
.hop{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:6px 0;opacity:.45;transition:opacity .3s}
.hop.on{opacity:1}
.hop .n{width:20px;height:20px;border-radius:50%;background:var(--surface-solid);border:2px solid var(--c);display:grid;place-items:center;font-family:var(--font-mono);font-size:9px;color:var(--fg);position:relative;z-index:1;transition:background .3s}
.hop.on .n{background:var(--c);color:var(--accent-ink)}
.hop.now .n{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.hop b{display:block;font-weight:600}
.hop .via{font-family:var(--font-mono);font-size:11px;color:var(--accent);margin:0 0 0 30px;padding:2px 0}
.hop p{margin:0;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:13px}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;padding:8px 14px;font-size:12.5px;color:var(--muted);z-index:3;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:820px){
  .bar{grid-template-columns:1fr auto;top:10px} .search{grid-column:1 / -1;justify-self:stretch;width:auto} .brand small{display:none}
  .legend{display:none} .trail{display:none}
  .card{left:0;right:0;top:auto;bottom:0;width:auto;max-height:50%;border-radius:var(--r) var(--r) 0 0}
}
@media (prefers-reduced-motion: reduce){ .pill .dot{animation:none} .hop{transition:none} }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="bar">
    <div class="brand glass"><span class="mark"></span><h1>Brain</h1><small>FRONTEND ↔ BROWSER</small></div>
    <div class="search glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Jump to a concept: event loop, fiber, CORS…" autocomplete="off"><kbd>/</kbd>
      <div class="sug glass" id="sug"></div>
    </div>
    <div class="tools">
      <div class="seg glass" role="group" aria-label="Mode"><button id="m-explore" aria-pressed="true">Explore</button><button id="m-route" aria-pressed="false">Route</button></div>
      <div class="icons glass">
        <button id="zin" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zout" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
        <button id="fit" title="Fit to view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
        <button id="expandall" title="Unfold everything"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/></svg></button>
        <button id="reset" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      </div>
    </div>
  </div>
  <div class="pill glass" id="pill"><span class="dot"></span><span id="pilltxt"></span></div>
  <div class="legend glass" id="legend"></div>
  <div class="trail glass" id="trail"></div>
  <div class="toast glass" id="toast"></div>
  <aside class="card glass" id="card"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// ================= DATA =================
const DOMAINS = {
  browser:{name:'Browser internals',c:'--d-browser'}, js:{name:'JavaScript',c:'--d-js'}, net:{name:'Network',c:'--d-net'},
  fw:{name:'Frameworks',c:'--d-fw'}, perf:{name:'Performance',c:'--d-perf'}, sec:{name:'Security',c:'--d-sec'},
  store:{name:'Storage',c:'--d-store'}, api:{name:'Web APIs',c:'--d-api'},
};
// [id, label, domain, description]
const NODES = [
 // browser: processes & threads
 ['browser_process','Browser process','browser','The parent process. Owns the UI (address bar, tabs), navigation, and brokers network and storage for renderers.'],
 ['renderer_process','Renderer process','browser','One per site (site isolation). Runs the main thread, compositor thread and worker threads for a tab.'],
 ['gpu_process','GPU process','browser','Talks to the graphics driver. Receives compositor frames and draws them to the screen.'],
 ['network_service','Network service','browser','The process that actually does DNS, sockets, TLS and the HTTP cache on behalf of renderers.'],
 ['main_thread','Main thread','browser','Where your JS, style, layout and paint all run. One thread, 16.7ms per frame at 60Hz. The thing you are always fighting for.'],
 ['compositor_thread','Compositor thread','browser','Assembles layers into a frame without the main thread. Handles scroll and compositor-only animations even when JS is blocked.'],
 ['raster_threads','Raster threads','browser','Turn paint display lists into pixel tiles, usually on the GPU. Only dirty tiles are redone.'],
 ['site_isolation','Site isolation','browser','Each site gets its own renderer process so a compromised page cannot read another site’s memory (Spectre defence).'],
 // browser: loading & parsing
 ['navigation','Navigation','browser','Browser process starts the request, picks or creates a renderer, then commits once headers arrive.'],
 ['html_parser','HTML parser','browser','Tokenizer plus tree builder. Incremental: builds DOM as bytes stream in. Pauses on a classic script tag.'],
 ['preload_scanner','Preload scanner','browser','A lookahead parser that finds src and href attributes and starts fetches while the main parser is blocked.'],
 ['css_parser','CSS parser','browser','Turns stylesheets into CSSOM. Stylesheets are render-blocking: no paint until they are parsed.'],
 ['dom','DOM','browser','The live tree of nodes. Every JS DOM API call is a message into this structure. Mutations mark it dirty for style.'],
 ['cssom','CSSOM','browser','Parsed stylesheet rules. Combined with DOM to resolve the cascade.'],
 ['bfcache','Back/forward cache','browser','Keeps the whole page alive in memory when you navigate away so back is instant. Broken by unload listeners and open connections.'],
 // browser: render pipeline
 ['style_calc','Style recalculation','browser','Matches selectors to nodes and computes the final value of every property. Cost grows with selector complexity and tree size.'],
 ['layout','Layout (reflow)','browser','Computes the geometry of every box. Changing width, font-size or adding nodes dirties it. Can cascade across the whole tree.'],
 ['paint','Paint','browser','Records draw commands (display list) per layer. Not pixels yet.'],
 ['layers','Compositing layers','browser','Elements promoted to their own layer (transform, will-change, video) can move without repainting others. Each costs GPU memory.'],
 ['composite','Composite','browser','Compositor thread positions all layer tiles and ships a frame to the GPU.'],
 ['frame','Frame / vsync','browser','The display refresh tick. The pipeline tries to produce one frame per tick. Miss it and you get jank.'],
 ['forced_layout','Forced synchronous layout','browser','Reading offsetWidth or getBoundingClientRect after a DOM write makes the browser run layout right now, inside your JS.'],
 ['hit_test','Hit testing','browser','Finds which element is under the pointer. Needs up-to-date layout.'],
 ['input_events','Input events','browser','Mouse, touch, keyboard arrive in the browser process, go to the compositor, then queue a task on the main thread.'],
 ['scroll','Scrolling','browser','Handled on the compositor thread using already-rasterised tiles. Non-passive listeners force it to wait for the main thread.'],
 // event loop
 ['event_loop','Event loop','browser','The loop that picks one task, runs it to completion, drains all microtasks, then maybe renders. Everything async funnels through here.'],
 ['task_queue','Task queue (macrotasks)','browser','setTimeout callbacks, I/O, input events, message events. One task per loop turn, rendering may happen between them.'],
 ['microtask_queue','Microtask queue','browser','Promise reactions, queueMicrotask, MutationObserver. Drained completely after every task, before rendering. Can starve the frame.'],
 ['raf','requestAnimationFrame','browser','Callbacks run once per frame right before style and layout. The correct place for visual updates.'],
 ['ric','requestIdleCallback','browser','Runs when the browser has nothing better to do. Deadline-based. Good for non-urgent work.'],
 ['timers','Timers','browser','setTimeout and setInterval. Minimum 4ms when nested, throttled to 1s in background tabs.'],
 ['web_workers','Web Workers','browser','Separate thread with its own event loop. No DOM access. Talk via postMessage and structured clone.'],
 ['long_task','Long task','browser','Any task over 50ms. Blocks input, blocks rendering, hurts INP. The metric your profiler flags red.'],
 // js engine
 ['v8','V8 (JS engine)','js','Parses, compiles and runs JS. Lives inside the renderer on the main thread (or a worker).'],
 ['js_parser','Parser / pre-parser','js','Lazy parsing: functions are pre-parsed and fully parsed only when called. Big bundles pay here.'],
 ['ignition','Ignition (interpreter)','js','Compiles to bytecode fast and starts running immediately.'],
 ['turbofan','TurboFan (JIT)','js','Hot functions get optimised to machine code based on observed types. Changing types later deoptimises.'],
 ['hidden_classes','Hidden classes & inline caches','js','V8 tracks object shapes. Same shape, same property order, fast property access. Adding properties dynamically breaks it.'],
 ['call_stack','Call stack','js','Frames of currently executing functions. Synchronous. Must be empty before the event loop can run the next task.'],
 ['heap','Heap','js','Where objects live. Young generation (short-lived) and old generation.'],
 ['gc','Garbage collection','js','Mark and sweep. Minor GCs are cheap, major GCs pause the main thread. Allocation rate per frame matters.'],
 ['memory_leak','Memory leaks','js','Detached DOM nodes held by closures, forgotten listeners and timers, growing caches.'],
 ['execution_context','Execution context','js','Created per function call: variable environment, scope chain, this binding.'],
 ['scope','Scope & closures','js','Functions capture the environment they were created in. Closures are why callbacks remember state and why leaks happen.'],
 ['this','this binding','js','Set by how a function is called, not where it is defined. Arrow functions inherit it lexically.'],
 ['prototype','Prototype chain','js','Property lookup walks the chain. Classes are sugar over it.'],
 ['hoisting','Hoisting & TDZ','js','Declarations are processed before execution. let and const exist but are inaccessible until their line (temporal dead zone).'],
 ['promises','Promises','js','A value that will exist later. Every .then reaction is queued as a microtask.'],
 ['async_await','async / await','js','Syntax over promises. await suspends the function and resumes it as a microtask when the promise settles.'],
 ['generators','Generators','js','Functions that can pause and resume. The mechanism async/await is built on.'],
 ['esm','ES modules','js','Static imports, resolved and linked before execution. Deferred by default in the browser. Enables tree shaking.'],
 ['dynamic_import','Dynamic import()','js','Returns a promise for a module. The primitive behind code splitting.'],
 ['structured_clone','Structured clone','js','How data crosses to workers, IndexedDB and postMessage. Copies, does not share. Functions and DOM nodes cannot cross.'],
 ['typed_arrays','Typed arrays & ArrayBuffer','js','Raw binary memory. Transferable to workers without copying.'],
 ['weakref','WeakMap / WeakRef','js','Hold references the GC is allowed to collect. Used for caches keyed by objects.'],
 ['proxy','Proxy / Reflect','js','Intercept property access. The engine of Vue 3 and Solid reactivity.'],
 ['json','JSON parse / stringify','js','Synchronous and on the main thread. Large payloads block.'],
 // network
 ['dns','DNS','net','Hostname to IP. Cached at OS and browser level. dns-prefetch hint warms it.'],
 ['tcp','TCP','net','Reliable byte stream. One round trip to establish.'],
 ['tls','TLS','net','Encryption handshake on top of TCP. 1 to 2 more round trips. TLS 1.3 allows 0-RTT resumption.'],
 ['http1','HTTP/1.1','net','One request per connection at a time. Browsers open 6 per host to compensate.'],
 ['http2','HTTP/2','net','Multiplexes many streams over one connection. Header compression. Head-of-line blocking moves to TCP.'],
 ['http3','HTTP/3 / QUIC','net','UDP based. No TCP head-of-line blocking, faster handshake, connection migration.'],
 ['http_cache','HTTP cache','net','Disk and memory cache keyed by URL. Cache-Control decides freshness; ETag enables cheap revalidation.'],
 ['cache_control','Cache-Control & ETag','net','max-age, immutable, no-store, stale-while-revalidate. The headers that decide whether a request leaves the device.'],
 ['cdn','CDN','net','Edge servers near users. Caches responses, terminates TLS close by, cuts TTFB.'],
 ['fetch','fetch()','net','Promise-based request API. Streams the body. Does not reject on HTTP errors.'],
 ['xhr','XMLHttpRequest','net','The older request API. Still the only one with upload progress events.'],
 ['websocket','WebSocket','net','Persistent bidirectional connection upgraded from HTTP.'],
 ['sse','Server-sent events','net','One-way server push over a long-lived HTTP response. Auto-reconnects.'],
 ['streams','Streams API','net','ReadableStream and friends. Process a response as chunks arrive instead of waiting for the whole body.'],
 ['resource_hints','Resource hints','net','preload, preconnect, prefetch, modulepreload, dns-prefetch. Tell the browser about resources before it discovers them.'],

// ================= GRAPH BUILD + VALIDATION =================
const N = new Map(NODES.map(n=>[n.id,n]));
const adj = new Map(NODES.map(n=>[n.id,[]]));
const bad = EDGES.filter(e=>!N.has(e[0])||!N.has(e[1]));
if(bad.length) console.error('bad edges', bad);
EDGES.forEach(([a,b,rel])=>{ if(!N.has(a)||!N.has(b)) return; adj.get(a).push({to:b,rel,dir:'out'}); adj.get(b).push({to:a,rel,dir:'in'}); });
NODES.forEach(n=>{ n.deg=adj.get(n.id).length; });
const SEEDS = ['event_loop','main_thread','v8','dom','fetch','fiber','sop','core_web_vitals'];

// ================= STATE =================
let visible = new Set(SEEDS);
let mode='explore', selected=null, hover=null, routeA=null, routeB=null, routePath=null, routeStart=0, lastHop=-1;
let activeDomains = new Set(Object.keys(DOMAINS));
let trail=[];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const HOP_MS = 650, POP_MS = 520, STAGGER = 45;

// ================= CANVAS + FORCE =================
const canvas=$('#c'), ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1; let transform=d3.zoomIdentity;
const colors={};
function readColors(){ const cs=getComputedStyle(document.documentElement); for(const k in DOMAINS) colors[k]=cs.getPropertyValue(DOMAINS[k].c).trim(); ['--bg','--bg-2','--fg','--muted','--line-strong','--accent','--surface-solid'].forEach(v=>colors[v]=cs.getPropertyValue(v).trim()); }
readColors(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();dirty=true;});
new MutationObserver(()=>{readColors();dirty=true;}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const sim = d3.forceSimulation()
  .force('charge',d3.forceManyBody().strength(-520).distanceMax(600))
  .force('link',d3.forceLink().id(d=>d.id).distance(l=>110+Math.min(90,(l.source.deg+l.target.deg)*3)).strength(.5))
  .force('collide',d3.forceCollide(d=>radius(d)+30).iterations(2))
  .force('center',d3.forceCenter(0,0).strength(.02)).force('x',d3.forceX(0).strength(.015)).force('y',d3.forceY(0).strength(.015))
  .alphaDecay(.03).on('tick',()=>dirty=true);
let simNodes=[], simLinks=[], dirty=true, animUntil=0;
const linkBorn=new Map();

function radius(n){ return 6+Math.min(12,Math.sqrt(n.deg)*1.6); }
function hiddenCount(n){ return adj.get(n.id).filter(e=>!visible.has(e.to)).length; }
function rebuild(){
  const now=performance.now();
  simNodes=[...visible].map(id=>{ const n=N.get(id); if(n.x===undefined){ n.x=(Math.random()-.5)*40; n.y=(Math.random()-.5)*40; } if(n.born===undefined) n.born=now; return n; });
  simLinks=EDGES.filter(e=>visible.has(e[0])&&visible.has(e[1])).map(e=>{ const key=e[0]+'|'+e[1]; if(!linkBorn.has(key)) linkBorn.set(key,now+ (Math.max(N.get(e[0]).born,N.get(e[1]).born)-now)); return {source:e[0],target:e[1],rel:e[2],key}; });
  sim.nodes(simNodes); sim.force('link').links(simLinks); sim.alpha(reduced?0.3:1).restart(); if(reduced){ sim.tick(140); sim.stop(); }
  animUntil=Math.max(animUntil, now+POP_MS+STAGGER*12); dirty=true; updateLegend();
}
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*DPR; canvas.height=H*DPR; dirty=true; }
addEventListener('resize',resize); resize();
transform=d3.zoomIdentity.translate(W/2,H/2);
const zoom=d3.zoom().scaleExtent([.25,3]).on('zoom',e=>{transform=e.transform;dirty=true;}).filter(e=>!e.button && !(e.type==='mousedown'&&dragNode));
d3.select(canvas).call(zoom).call(zoom.transform,transform);

let dragNode=null;
d3.select(canvas).call(d3.drag().container(canvas).subject(e=>{ const [x,y]=toWorld(e.x,e.y); return findNode(x,y); })
  .on('start',e=>{ dragNode=e.subject; canvas.classList.add('grabbing'); if(!e.active) sim.alphaTarget(.3).restart(); dragNode.fx=dragNode.x; dragNode.fy=dragNode.y; })
  .on('drag',e=>{ const [x,y]=toWorld(e.x,e.y); dragNode.fx=x; dragNode.fy=y; })
  .on('end',e=>{ if(!e.active) sim.alphaTarget(0); dragNode.fx=null; dragNode.fy=null; dragNode=null; canvas.classList.remove('grabbing'); }));
function toWorld(px,py){ return [(px-transform.x)/transform.k,(py-transform.y)/transform.k]; }
function findNode(x,y){ return sim.find(x,y,22/transform.k+8); }

let downAt=null;
canvas.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{ if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>5) return;
  const r=canvas.getBoundingClientRect(); const [x,y]=toWorld(e.clientX-r.left,e.clientY-r.top); const n=findNode(x,y); if(n) onNodeClick(n); else if(mode==='explore') select(null); });
canvas.addEventListener('pointermove',e=>{ const r=canvas.getBoundingClientRect(); const [x,y]=toWorld(e.clientX-r.left,e.clientY-r.top); const n=findNode(x,y)||null; if(n!==hover){hover=n;dirty=true; canvas.style.cursor = n? 'pointer' : ''; } });

function onNodeClick(n){
  if(mode==='route'){ if(!routeA||(routeA&&routeB)){ routeA=n; routeB=null; routePath=null; } else if(n!==routeA){ routeB=n; computeRoute(); } updatePill(); select(n); dirty=true; return; }
  expand(n); select(n);
}
// Unfold: place hidden neighbours in a ring around the parent, staggered pop-in.
function expand(n){
  const hidden=adj.get(n.id).filter(e=>!visible.has(e.to)).map(e=>N.get(e.to)); if(!hidden.length) return false;
  const now=performance.now(), base=Math.random()*Math.PI*2, ring=90+hidden.length*6;
  hidden.forEach((m,i)=>{ const a=base+i/hidden.length*Math.PI*2; m.x=n.x+Math.cos(a)*ring; m.y=n.y+Math.sin(a)*ring; m.born=now+i*STAGGER; m.vx=0; m.vy=0; visible.add(m.id); });
  n.fx=n.x; n.fy=n.y; setTimeout(()=>{n.fx=null;n.fy=null;},700); // anchor the parent while children burst out
  rebuild(); return true;
}
function collapse(n){ adj.get(n.id).forEach(e=>{ const m=e.to; if(SEEDS.includes(m)) return; const others=adj.get(m).some(x=>x.to!==n.id&&visible.has(x.to)); if(!others){ visible.delete(m); N.get(m).born=undefined; } }); rebuild(); }
function reveal(id,nearId){ if(visible.has(id)) return; const n=N.get(id), near=nearId&&N.get(nearId); if(near&&near.x!==undefined){ n.x=near.x+(Math.random()-.5)*60; n.y=near.y+(Math.random()-.5)*60; } n.born=performance.now(); visible.add(id); }

// ================= ROUTE =================
function shortestPath(a,b){
  const prev=new Map([[a,null]]); const q=[a];
  while(q.length){ const u=q.shift(); if(u===b) break; for(const e of adj.get(u)){ if(!prev.has(e.to)){ prev.set(e.to,u); q.push(e.to);} } }
  if(!prev.has(b)) return null; const path=[]; for(let v=b;v!==null;v=prev.get(v)) path.unshift(v); return path;
}
function relBetween(a,b){ const e=adj.get(a).find(x=>x.to===b); return e? (e.dir==='out'? e.rel : '← '+e.rel) : ''; }
function computeRoute(){ routePath=shortestPath(routeA.id,routeB.id); if(routePath){ routePath.forEach((id,i)=>reveal(id,routePath[i-1])); rebuild(); routeStart=performance.now(); lastHop=-1; renderRouteCard(); fitTo(routePath); } }
function updatePill(){ const p=$('#pill'); if(mode!=='route'){p.classList.remove('show');return;} p.classList.add('show'); $('#pilltxt').textContent = !routeA? 'Pick a start node' : !routeB? `From ${routeA.label}, now pick a destination` : `${routeA.label} → ${routeB.label} · ${routePath?routePath.length-1+' hops':'no path'}`; }

// ================= DRAW =================
const backOut=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeOut=t=>1-Math.pow(1-t,3);
function nodeScale(n,now){ if(reduced||n.born===undefined) return 1; const t=(now-n.born)/POP_MS; return t<=0?0: t>=1?1: backOut(t); }
function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle=colors['--bg']; ctx.fillRect(0,0,W,H);
  const k=transform.k;
  // dot grid in world space
  if(k>.45){ const step=60; const [x0,y0]=toWorld(0,0), [x1,y1]=toWorld(W,H); ctx.fillStyle=colors['--line-strong']; ctx.globalAlpha=Math.min(.55,(k-.45)); 
    for(let x=Math.floor(x0/step)*step;x<x1;x+=step) for(let y=Math.floor(y0/step)*step;y<y1;y+=step){ const sx=x*k+transform.x, sy=y*k+transform.y; ctx.fillRect(sx-.5,sy-.5,1,1); } ctx.globalAlpha=1; }
  ctx.translate(transform.x,transform.y); ctx.scale(k,k);
  const onPath=new Set(routePath||[]); const pathEdges=new Set(); if(routePath) for(let i=1;i<routePath.length;i++){ pathEdges.add(routePath[i-1]+'|'+routePath[i]); pathEdges.add(routePath[i]+'|'+routePath[i-1]); }
  const focus = selected && mode==='explore' ? selected : null; const nb = focus? new Set(adj.get(focus.id).map(e=>e.to)) : null;
  ctx.lineCap='round';
  // ---- edges
  for(const l of simLinks){
    const inPath=pathEdges.has(l.source.id+'|'+l.target.id); if(inPath) continue; // drawn separately
    const isFocus = focus && (l.source===focus||l.target===focus);
    const dim = routePath || (focus && !isFocus) || !activeDomains.has(l.source.domain) || !activeDomains.has(l.target.domain);
    const grow = reduced? 1 : Math.max(0,Math.min(1,(now-(linkBorn.get(l.key)||0))/420));
    const s=nodeScale(l.source,now)>0?l.source:l.target, t=s===l.source?l.target:l.source; // grow from the older node
    const gx=s.x+(t.x-s.x)*easeOut(grow), gy=s.y+(t.y-s.y)*easeOut(grow);
    ctx.strokeStyle = isFocus? colors[l.source===focus?l.target.domain:l.source.domain] : colors['--line-strong'];
    ctx.globalAlpha = dim? .08 : (isFocus? .95 : .5); ctx.lineWidth = isFocus? 1.6/k : 1/k;
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(gx,gy); ctx.stroke();
    if(isFocus && k>.6 && grow>=1) edgeLabel(l.source,l.target,l.rel,colors['--muted'],k);
  }
  // ---- route: progressive draw + travelling pulse
  let hopNow=-1;
  if(routePath && routePath.length>1){
    const segs=routePath.length-1; const el=now-routeStart; const phase = reduced? segs : el/HOP_MS;
    const drawn=Math.min(segs,phase);
    ctx.strokeStyle=colors['--accent']; ctx.lineWidth=2.6/k; ctx.globalAlpha=1; ctx.shadowColor=colors['--accent']; ctx.shadowBlur=12/k;
    for(let i=0;i<segs;i++){ const a=N.get(routePath[i]), b=N.get(routePath[i+1]); const f=Math.max(0,Math.min(1,drawn-i)); if(f<=0) break;
      const ex=a.x+(b.x-a.x)*easeOut(f), ey=a.y+(b.y-a.y)*easeOut(f); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(ex,ey); ctx.stroke(); }
    ctx.shadowBlur=0;
    if(k>.6) for(let i=0;i<Math.floor(drawn);i++) edgeLabel(N.get(routePath[i]),N.get(routePath[i+1]),relBetween(routePath[i],routePath[i+1]),colors['--accent'],k);
    // pulse
    let p; if(phase<segs) p=phase; else p=reduced? segs-0.0001 : ((phase-segs)*0.6)%segs; // slower loop after first draw
    const i=Math.floor(p), f=p-i; const a=N.get(routePath[i]), b=N.get(routePath[Math.min(i+1,segs)]);
    const px=a.x+(b.x-a.x)*easeOut(f), py=a.y+(b.y-a.y)*easeOut(f);
    const g=ctx.createRadialGradient(px,py,0,px,py,16/k); g.addColorStop(0,colors['--accent']); g.addColorStop(1,'rgba(255,180,84,0)');
    ctx.fillStyle=g; ctx.globalAlpha=.9; ctx.beginPath(); ctx.arc(px,py,16/k,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=colors['--fg']; ctx.beginPath(); ctx.arc(px,py,3.5/k,0,Math.PI*2); ctx.fill();
    hopNow = phase<segs? Math.floor(phase) : i + (f>.5?1:0);
  }
  if(hopNow!==lastHop){ lastHop=hopNow; syncHops(hopNow); }
  // ---- nodes
  for(const n of simNodes){
    const sc=nodeScale(n,now); if(sc<=0) continue;
    const r=radius(n)*sc, c=colors[n.domain]; const isSel=n===selected, isHov=n===hover, inPath=onPath.has(n.id), isNb=focus&&nb.has(n.id);
    const dim = (routePath && !inPath) || (focus && n!==focus && !isNb) || !activeDomains.has(n.domain);
    ctx.globalAlpha = dim? .16 : 1;
    // glow halo
    if(isSel||isHov||inPath||n===routeA||n===routeB){ const breathe = reduced?0 : Math.sin(now/500)*1.5; const hr=r+7/k+breathe;
      const g=ctx.createRadialGradient(n.x,n.y,r,n.x,n.y,hr+10/k); const col=(inPath||n===routeA||n===routeB)?colors['--accent']:c; g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.globalAlpha=(dim?.1:.35); ctx.beginPath(); ctx.arc(n.x,n.y,hr+10/k,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=dim?.16:1;
      ctx.beginPath(); ctx.arc(n.x,n.y,hr,0,Math.PI*2); ctx.strokeStyle=col; ctx.lineWidth=1.5/k; ctx.stroke(); }
    // body: ring + core
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2); ctx.fillStyle=colors['--surface-solid']; ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=2/k; ctx.stroke();
    ctx.beginPath(); ctx.arc(n.x,n.y,Math.max(1.5,r*.5),0,Math.PI*2); ctx.fillStyle=c; ctx.fill();
    const hc=hiddenCount(n); if(hc && !routePath && sc>=1){ const bx=n.x+r*.8, by=n.y-r*.8;
      ctx.beginPath(); ctx.arc(bx,by,6.5/Math.max(k,.8),0,Math.PI*2); ctx.fillStyle=c; ctx.fill();
      ctx.fillStyle=colors['--accent-ink']||'#000'; ctx.font=`600 ${8.5/Math.max(k,.8)}px IBM Plex Mono,monospace`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(hc,bx,by+.5/k); }
    const showLabel = isSel || isHov || inPath || isNb || (focus? false : (k>.9 || (k>.55 && n.deg>10)));
    if(showLabel && sc>.6){ const fs=12/Math.max(k,.9); ctx.font=`${(isSel||inPath?600:500)} ${fs}px IBM Plex Sans,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='top';
      const lw=ctx.measureText(n.label).width; ctx.fillStyle=colors['--bg']; ctx.globalAlpha = dim? .2 : .75; roundRect(n.x-lw/2-5/k,n.y+r+3/k,lw+10/k,fs+6/k,4/k); ctx.fill();
      ctx.globalAlpha = dim? .3 : 1; ctx.fillStyle=colors['--fg']; ctx.fillText(n.label,n.x,n.y+r+6/k); }
  }
  ctx.globalAlpha=1;
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function edgeLabel(a,b,txt,col,k){ ctx.save(); ctx.globalAlpha=1; const fs=10/k; ctx.font=`${fs}px IBM Plex Mono,monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2; let ang=Math.atan2(b.y-a.y,b.x-a.x); if(ang>Math.PI/2||ang<-Math.PI/2) ang+=Math.PI; ctx.translate(mx,my); ctx.rotate(ang);
  const w=ctx.measureText(txt).width+10/k; ctx.fillStyle=colors['--bg']; ctx.globalAlpha=.9; roundRect(-w/2,-fs*.8,w,fs*1.6,3/k); ctx.fill(); ctx.globalAlpha=1; ctx.fillStyle=col; ctx.fillText(txt,0,0); ctx.restore(); }
function syncHops(i){ document.querySelectorAll('.hop').forEach((h,j)=>{ h.classList.toggle('on',j<=i); h.classList.toggle('now',j===i); }); }

(function loop(){ requestAnimationFrame(loop); if(document.hidden) return; const now=performance.now();
  const animating = now<animUntil || (routePath && !reduced) || ((selected||hover) && !reduced);
  if(!dirty && !animating) return; dirty=false; draw(now); })();

// ================= CARD =================
const ICON={route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h6"/></svg>', unfold:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>', fold:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 6V3M12 21v-3M6 12H3M21 12h-3"/></svg>'};
function pushTrail(n){ trail=trail.filter(x=>x!==n); trail.push(n); if(trail.length>6) trail.shift(); const t=$('#trail'); t.innerHTML='<span class="t">Trail</span>'+trail.map((x,i)=>`${i?'<span class="sep">›</span>':''}<button data-id="${x.id}" style="--c:var(${DOMAINS[x.domain].c})">${x.label}</button>`).join(''); t.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const m=N.get(b.dataset.id); select(m); centerOn(m); }); }
function select(n){ selected=n; dirty=true; const card=$('#card'); if(!n){ if(!routePath) card.classList.remove('show'); else renderRouteCard(); return; }
  pushTrail(n);
  if(mode==='route' && routePath){ renderRouteCard(); return; }
  const c=`var(${DOMAINS[n.domain].c})`; const hc=hiddenCount(n);
  card.style.setProperty('--c',c); card.classList.add('show');
  const out=adj.get(n.id).filter(e=>e.dir==='out'), inn=adj.get(n.id).filter(e=>e.dir==='in');
  const li=e=>`<li><button data-to="${e.to}" style="--c:var(${DOMAINS[N.get(e.to).domain].c})"><span class="to">${N.get(e.to).label}</span><span class="rel">${e.rel}</span></button></li>`;
  card.innerHTML=`<div class="card-h"><button class="x" id="close" aria-label="Close">✕</button>
      <span class="dom">${DOMAINS[n.domain].name}</span><h2>${n.label}</h2><p class="desc">${n.desc}</p></div>
    <div class="card-b">
      <div class="row">${hc?`<button class="btn primary" id="exp">${ICON.unfold}Unfold ${hc} more</button>`:`<button class="btn" id="col">${ICON.fold}Fold</button>`}<button class="btn" id="rfrom">${ICON.route}From here</button><button class="btn" id="rto">${ICON.route}To here</button></div>
      ${out.length?`<div class="lbl">${n.label} → drives (${out.length})</div><ul class="touch">${out.map(li).join('')}</ul>`:''}
      ${inn.length?`<div class="lbl">Driven by → ${n.label} (${inn.length})</div><ul class="touch">${inn.map(li).join('')}</ul>`:''}
    </div>`;
  $('#close').onclick=()=>select(null);
  const ex=$('#exp'); if(ex) ex.onclick=()=>{expand(n);select(n);};
  const co=$('#col'); if(co) co.onclick=()=>{collapse(n);select(n);};
  $('#rfrom').onclick=()=>{ setMode('route'); routeA=n; routeB=null; routePath=null; updatePill(); dirty=true; toast('Now pick a destination on the map'); };
  $('#rto').onclick=()=>{ setMode('route'); if(routeA&&routeA!==n){ routeB=n; computeRoute(); } else { routeA=n; routeB=null; toast('Now pick a start node on the map'); } updatePill(); dirty=true; };
  card.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{ const m=N.get(b.dataset.to); if(!visible.has(m.id)){ reveal(m.id,n.id); rebuild(); } select(m); centerOn(m); });
}
function renderRouteCard(){
  const card=$('#card'); card.classList.add('show'); card.style.setProperty('--c','var(--accent)');
  if(!routePath){ card.innerHTML=`<div class="card-h"><button class="x" id="close" aria-label="Close">✕</button><span class="dom">Route</span><h2>No path</h2><p class="desc">These two are not connected in the graph yet.</p></div>`; $('#close').onclick=()=>{routeA=routeB=null;updatePill();select(null);}; return; }
  card.innerHTML=`<div class="card-h"><button class="x" id="close" aria-label="Close">✕</button>
      <span class="dom">Route · ${routePath.length-1} hops</span><h2>${routeA.label} → ${routeB.label}</h2><p class="desc">Shortest chain of “touches”. Follow the pulse on the map; each step lights up as it arrives.</p></div>
    <div class="card-b"><ol class="hops">${routePath.map((id,i)=>{ const n=N.get(id); const via=i>0?`<div class="via">${relBetween(routePath[i-1],id)}</div>`:''; return `${via}<li class="hop" style="--c:var(${DOMAINS[n.domain].c})"><span class="n">${i+1}</span><div><b>${n.label}</b><p>${n.desc}</p></div></li>`; }).join('')}</ol>
    <div class="row" style="margin-top:14px"><button class="btn" id="replay">Replay</button><button class="btn" id="swap">Reverse</button><button class="btn" id="clear">Clear route</button></div></div>`;
  $('#close').onclick=()=>card.classList.remove('show');
  $('#replay').onclick=()=>{ routeStart=performance.now(); lastHop=-1; dirty=true; };
  $('#swap').onclick=()=>{ [routeA,routeB]=[routeB,routeA]; computeRoute(); updatePill(); dirty=true; };
  $('#clear').onclick=()=>{ routeA=routeB=null; routePath=null; updatePill(); card.classList.remove('show'); dirty=true; };
}
function centerOn(n){ const t=d3.zoomIdentity.translate(W/2-n.x*transform.k, H/2-n.y*transform.k).scale(transform.k); d3.select(canvas).transition().duration(reduced?0:450).call(zoom.transform,t); }
function fitTo(ids){ const ns=(ids? ids.map(id=>N.get(id)) : simNodes).filter(n=>n.x!==undefined); if(!ns.length) return;
  setTimeout(()=>{ let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; ns.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);});
    const pad=120; const k=Math.max(.25,Math.min(1.6,Math.min(W/(x1-x0+pad*2),H/(y1-y0+pad*2)))); const cx=(x0+x1)/2, cy=(y0+y1)/2;
    d3.select(canvas).transition().duration(reduced?0:600).call(zoom.transform,d3.zoomIdentity.translate(W/2-cx*k,H/2-cy*k).scale(k)); }, reduced?0:500); }
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

// ================= TOOLBAR =================
function setMode(m){ mode=m; $('#m-explore').setAttribute('aria-pressed',m==='explore'); $('#m-route').setAttribute('aria-pressed',m==='route'); canvas.classList.toggle('pick',m==='route'); if(m==='explore'){ routeA=routeB=null; routePath=null; if(!selected) $('#card').classList.remove('show'); } updatePill(); dirty=true; }
$('#m-explore').onclick=()=>setMode('explore'); $('#m-route').onclick=()=>setMode('route');
$('#expandall').onclick=()=>{ const now=performance.now(); let i=0; NODES.forEach(n=>{ if(!visible.has(n.id)){ n.born=now+(i++%40)*STAGGER; visible.add(n.id);} }); rebuild(); fitTo(); };
$('#reset').onclick=()=>{ visible=new Set(SEEDS); NODES.forEach(n=>{n.x=undefined;n.y=undefined;n.born=undefined;}); linkBorn.clear(); routeA=routeB=null; routePath=null; trail=[]; $('#trail').innerHTML=''; select(null); setMode('explore'); rebuild(); d3.select(canvas).transition().duration(reduced?0:400).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2)); };
$('#zin').onclick=()=>d3.select(canvas).transition().duration(200).call(zoom.scaleBy,1.4);
$('#zout').onclick=()=>d3.select(canvas).transition().duration(200).call(zoom.scaleBy,1/1.4);
$('#fit').onclick=()=>fitTo();
function updateLegend(){ const l=$('#legend'); const vis=simNodes.length; const counts={}; simNodes.forEach(n=>counts[n.domain]=(counts[n.domain]||0)+1);
  l.innerHTML=`<div class="t"><span>Layers</span><span>${vis} / ${NODES.length} shown</span></div>`+Object.keys(DOMAINS).map(k=>`<button data-d="${k}" aria-pressed="${activeDomains.has(k)}" style="--c:var(${DOMAINS[k].c})">${DOMAINS[k].name}<span class="cnt">${counts[k]||0}</span></button>`).join('');
  l.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=b.dataset.d; activeDomains.has(k)?activeDomains.delete(k):activeDomains.add(k); updateLegend(); dirty=true; }); }

// search
const q=$('#q'), sug=$('#sug'); let hl=0;
function showSug(){ const v=q.value.trim().toLowerCase(); if(!v){sug.style.display='none';return;} const hits=NODES.filter(n=>n.label.toLowerCase().includes(v)||n.id.includes(v)||n.desc.toLowerCase().includes(v)).slice(0,8); hl=0;
  sug.innerHTML=hits.map((n,i)=>`<button data-id="${n.id}" class="${i===0?'hl':''}" style="--c:var(${DOMAINS[n.domain].c})"><span class="sw"></span>${n.label}<span class="dm">${DOMAINS[n.domain].name}</span></button>`).join(''); sug.style.display=hits.length?'block':'none';
  sug.querySelectorAll('button').forEach(b=>b.onclick=()=>jump(b.dataset.id)); }
function jump(id){ const n=N.get(id); if(!visible.has(id)){ reveal(id, selected&&selected.id); rebuild(); } sug.style.display='none'; q.value=''; q.blur(); if(mode==='route') onNodeClick(n); else { expand(n); select(n); } setTimeout(()=>centerOn(n),reduced?0:350); }
q.addEventListener('input',showSug); q.addEventListener('focus',showSug); q.addEventListener('blur',()=>setTimeout(()=>sug.style.display='none',150));
q.addEventListener('keydown',e=>{ const bs=[...sug.querySelectorAll('button')]; if(e.key==='Escape'){q.blur();return;} if(!bs.length) return; if(e.key==='ArrowDown'){hl=(hl+1)%bs.length;} else if(e.key==='ArrowUp'){hl=(hl-1+bs.length)%bs.length;} else if(e.key==='Enter'){ bs[hl].click(); return; } else return; bs.forEach((b,i)=>b.classList.toggle('hl',i===hl)); e.preventDefault(); });
addEventListener('keydown',e=>{ if(e.target===q) return; if(e.key==='/'){ e.preventDefault(); q.focus(); } if(e.key==='Escape'){ if(routePath){ routeA=routeB=null; routePath=null; updatePill(); } select(null); $('#card').classList.remove('show'); dirty=true; } });

// go
rebuild(); updateLegend();
</script>
